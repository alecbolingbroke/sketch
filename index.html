<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Live sketch</title>
<meta name="description" content="Type a word or drop in a photo and watch a coral-like pattern grow out of it. Turn on the mic and it moves with the music.">
<style>
  html, body { margin: 0; height: 100%; background: #050d12; color: #ffeedd; font: 16px/1.4 system-ui, sans-serif; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  form { position: fixed; left: 50%; bottom: max(16px, env(safe-area-inset-bottom)); transform: translateX(-50%);
         display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; width: min(560px, calc(100% - 32px)); }
  input[type=text], button { font: inherit; color: inherit; background: rgba(5, 13, 18, .72); border: 1px solid rgba(255, 238, 221, .35);
         border-radius: 999px; padding: 10px 16px; min-height: 44px; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
  input[type=text] { flex: 1 1 180px; min-width: 0; }
  button { cursor: pointer; }
  button[aria-pressed=true] { background: #ffeedd; color: #050d12; }
  :focus-visible { outline: 2px solid #ff7a5c; outline-offset: 2px; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }
  #note { position: fixed; top: 16px; left: 50%; transform: translateX(-50%); width: max-content; max-width: calc(100% - 32px); box-sizing: border-box; margin: 0;
          font-size: 13px; text-align: center; pointer-events: none; background: rgba(5, 13, 18, .72); border-radius: 999px; padding: 6px 14px; }
</style>
</head>
<body>
<canvas id="c" role="img" aria-label="A coral-like pattern growing out of the word or photo you gave it"></canvas>
<p id="note">Type a word or add a photo. Drag to stir. Photos never leave your device.</p>
<form id="f">
  <label class="sr" for="t">Word to grow from</label>
  <input id="t" type="text" maxlength="40" placeholder="Type a word" autocomplete="off" enterkeyhint="go">
  <button type="button" id="photo">Photo</button>
  <input id="file" type="file" accept="image/*" hidden>
  <button type="button" id="mic" aria-pressed="false">Listen</button>
</form>
<script src="sketch.js"></script>
</body>
</html>
